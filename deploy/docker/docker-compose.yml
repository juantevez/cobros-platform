# docker-compose.yml — Entorno de desarrollo local
#
# Modos de uso:
#
#   Solo infraestructura (Postgres + NATS) para desarrollo local:
#     docker compose up -d
#     make migrate
#     make run-api      ← en terminal 1
#     make run-worker   ← en terminal 2
#
#   Todo dockerizado (infraestructura + migraciones + binarios):
#     docker compose --profile app up -d --build
#     docker compose --profile app logs -f
#
#   Solo migraciones (sin levantar la app):
#     docker compose --profile tools run --rm migrate

services:

  # ── Infraestructura ───────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       cobros
      POSTGRES_USER:     cobros
      POSTGRES_PASSWORD: cobros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobros -d cobros"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nats:
    image: nats:2.10-alpine
    # JetStream habilitado con persistencia en /data
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"   # clientes
      - "8222:8222"   # HTTP monitoring → http://localhost:8222/healthz
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Migraciones ───────────────────────────────────────────────────────────
  # Corre golang-migrate y termina (exit 0). Los servicios api y worker
  # esperan a que complete antes de arrancar (service_completed_successfully).
  #
  # Disponible en dos profiles:
  #   app   → corre automáticamente al hacer --profile app up
  #   tools → corre de forma aislada: docker compose --profile tools run --rm migrate

  migrate:
    profiles: [app, tools]
    image: migrate/migrate:v4
    command:
      - "-path=/migrations"
      - "-database=postgres://cobros:cobros@postgres:5432/cobros?sslmode=disable"
      - "up"
    volumes:
      - ../../migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Aplicación (profile "app") ────────────────────────────────────────────
  # Activos solo con: docker compose --profile app up
  # En desarrollo se prefiere: make run-api / make run-worker

  api:
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: api
    environment:
      # HTTP
      HTTP_ADDR:              ":8080"
      HTTP_READ_TIMEOUT_SEC:  "10"
      HTTP_WRITE_TIMEOUT_SEC: "30"
      # PostgreSQL
      DATABASE_URL: "postgres://cobros:cobros@postgres:5432/cobros?sslmode=disable"
      DB_MAX_CONNS: "25"
      DB_MIN_CONNS: "5"
      # NATS
      NATS_URL: "nats://nats:4222"
      # Auth
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production-needs-32-chars!!}"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  worker:
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: worker
    environment:
      # PostgreSQL
      DATABASE_URL:      "postgres://cobros:cobros@postgres:5432/cobros?sslmode=disable"
      DB_MAX_CONNS:      "10"
      DB_MIN_CONNS:      "2"
      # NATS
      NATS_URL:          "nats://nats:4222"
      # Outbox relay
      OUTBOX_INTERVAL:   "1s"
      OUTBOX_BATCH_SIZE: "50"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

volumes:
  postgres_data:
  nats_data:
