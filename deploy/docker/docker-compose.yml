# docker-compose.yml — Entorno de desarrollo local
#
# Uso básico (levanta TODO: infra + migraciones + api + worker):
#
#   docker compose up -d --build
#   docker compose logs -f api worker
#
# Solo infraestructura (para correr api/worker con `go run` local):
#
#   docker compose up -d postgres nats
#   make migrate
#   make run-api      ← terminal 1
#   make run-worker   ← terminal 2
#
# Solo migraciones:
#
#   docker compose run --rm migrate

services:

  # ── Infraestructura ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       cobros
      POSTGRES_USER:     cobros
      POSTGRES_PASSWORD: cobros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobros -d cobros"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Migraciones ────────────────────────────────────────────────────────────
  # Corre golang-migrate y termina (exit 0).
  # api y worker esperan a que complete (service_completed_successfully).

  migrate:
    image: migrate/migrate:v4
    command:
      - "-path=/migrations"
      - "-database=postgres://cobros:cobros@postgres:5432/cobros?sslmode=disable"
      - "up"
    volumes:
      - ../../migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Aplicación ─────────────────────────────────────────────────────────────

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: api
    environment:
      HTTP_ADDR:              ":8080"
      HTTP_READ_TIMEOUT_SEC:  "10"
      HTTP_WRITE_TIMEOUT_SEC: "30"
      DATABASE_URL:           "postgres://cobros:cobros@postgres:5432/cobros?sslmode=disable"
      DB_MAX_CONNS:           "25"
      DB_MIN_CONNS:           "5"
      NATS_URL:               "nats://nats:4222"
      JWT_SECRET:             "${JWT_SECRET:-change-me-in-production-needs-32-chars!!}"
      # SMTP vacío → usa LogSender (loguea emails en stdout, no envía)
      SMTP_HOST:              "${SMTP_HOST:-}"
      SMTP_PORT:              "${SMTP_PORT:-587}"
      SMTP_USERNAME:          "${SMTP_USERNAME:-}"
      SMTP_PASSWORD:          "${SMTP_PASSWORD:-}"
      SMTP_FROM:              "${SMTP_FROM:-noreply@cobros-platform.com}"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: worker
    environment:
      DATABASE_URL:      "postgres://cobros:cobros@postgres:5432/cobros?sslmode=disable"
      DB_MAX_CONNS:      "10"
      DB_MIN_CONNS:      "2"
      NATS_URL:          "nats://nats:4222"
      OUTBOX_INTERVAL:   "1s"
      OUTBOX_BATCH_SIZE: "50"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  nats_data:
